name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Mozc dictionary source
        uses: actions/cache@v4
        with:
          path: .dict-cache
          key: mozc-dict-${{ hashFiles('app/build.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Secrets に鍵があればそれで署名する (無ければデバッグ鍵)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk s6-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: s6-keyboard-apk
          path: s6-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: keyboard-screenshots
          path: app/build/screenshots

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest s6-keyboard.apk \
            --title "最新ビルド (${GITHUB_SHA::7})" \
            --notes "main の最新コミット ${GITHUB_SHA} からの自動ビルドです。" \
            --prerelease
